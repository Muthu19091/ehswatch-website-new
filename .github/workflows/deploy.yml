name: Deploy to ehswatch.com

# Pushing a fix to `stage` used to mean "it exists on GitHub" -- getting it
# actually running on the server was a separate, easy-to-forget manual SSH
# step. This closes that gap: every push here builds and deploys itself.
#
# Targets the live server directly (git pull + npm run build + pm2 restart,
# same steps already verified working by hand) -- no tarball/standalone
# swap, since this app runs from a plain `next start` on a git checkout,
# not a `output: standalone` build.

on:
  push:
    branches: [stage]
  workflow_dispatch:

concurrency:
  group: deploy-ehswatch
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Pull, build, and restart on the server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e
            cd /var/www/ehswatch/ehswatch-website
            git fetch origin stage
            git reset --hard origin/stage
            npm ci
            npm run build
            pm2 restart ehs-website
